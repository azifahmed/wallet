server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:walletdb}
    username: ${DB_USER:walletuser}
    password: ${DB_PASSWORD:walletpass}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring.xml

app:
  auth:
    tokens:
      user1: "token-user1"
      user2: "token-user2"
      user3: "token-user3"
      user4: "token-user4"
      user5: "token-user5"
  rate-limit:
    enabled: true
    authenticated-limit: 300
    unauthenticated-limit: 30
    window-seconds: 60
