server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-message: always

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:walletdb}
    username: ${DB_USER:walletuser}
    password: ${DB_PASSWORD:walletpass}
    hikari:
      minimum-idle: 5
      # Cap matches Postgres budget on a single host; raise only with DB capacity.
      maximum-pool-size: 20
      # Fail fast instead of parking virtual threads for 30s on an empty pool.
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring.xml

app:
  auth:
    tokens:
      user1: "token-user1"
      user2: "token-user2"
      user3: "token-user3"
      user4: "token-user4"
      user5: "token-user5"
      admin: "token-admin"
  rate-limit:
    enabled: true
    authenticated-limit: 300
    unauthenticated-limit: 30
    window-seconds: 60
  # Keep permits ≤ hikari.maximum-pool-size; leave headroom for health checks.
  db-concurrency:
    enabled: true
    permits: 18
    acquire-timeout-ms: 0
    retry-after-seconds: 1
