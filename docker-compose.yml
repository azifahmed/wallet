services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: walletuser
      POSTGRES_PASSWORD: walletpass
      POSTGRES_DB: walletdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletuser -d walletdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: walletdb
      DB_USER: walletuser
      DB_PASSWORD: walletpass
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3

volumes:
  pg_data:
